{% extends "base.html" %}

{% block content %}
<main class="app-shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">Luna Plus Thailand</p>
      <h1>Boss Spawn Tracker</h1>
    </div>
    <div class="refresh-panel">
      <span id="last-updated">ยังไม่ได้โหลดข้อมูล</span>
      <button id="refresh-button" type="button">รีเฟรช</button>
    </div>
  </header>

  <section class="app-tabs" role="tablist" aria-label="Boss tracker tabs">
    <button id="tab-spawn-tracker" class="tab-button is-active" type="button" role="tab" aria-selected="true" aria-controls="panel-spawn-tracker" data-tab-target="spawn-tracker">Boss Spawn Tracker</button>
    <button id="tab-world-boss" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="panel-world-boss" data-tab-target="world-boss">World Boss Tracker</button>
  </section>

  <section id="panel-spawn-tracker" class="tab-panel is-active" role="tabpanel" aria-labelledby="tab-spawn-tracker" data-tab-panel="spawn-tracker">
    <section class="controls" aria-label="ค้นหาและกรองข้อมูล">
      <label>
        <span>ค้นหา</span>
        <input id="search-input" type="search" placeholder="ชื่อบอสหรือแผนที่">
      </label>
      <label>
        <span>Kind</span>
        <input id="kind-filter" type="search" placeholder="เช่น 83,393">
      </label>
      <label>
        <span>ประเภท</span>
        <select id="category-filter">
          <option value="">ทุกประเภท</option>
        </select>
      </label>
      <label>
        <span>แผนที่</span>
        <select id="map-filter">
          <option value="">ทุกแผนที่</option>
        </select>
      </label>
    </section>

    <section class="results-panel" aria-busy="true">
      <div id="loading" class="loading">
        <div class="loader"></div>
        <span>กำลังโหลดข้อมูล Boss...</span>
      </div>

      <div id="error-box" class="error-box" hidden></div>
      <section id="boss-list" class="boss-grid" aria-live="polite"></section>
      <p id="empty-state" class="empty-state" hidden>ไม่พบ Boss ที่ตรงกับเงื่อนไข</p>
    </section>
  </section>

  <section id="panel-world-boss" class="tab-panel" role="tabpanel" aria-labelledby="tab-world-boss" data-tab-panel="world-boss" hidden>
    <section class="world-boss-panel" aria-live="polite">
      <div class="section-head">
        <div>
          <p class="eyebrow">Target Kind 261 / 267 / 280 / 721</p>
          <h2>World Boss Tracker</h2>
        </div>
      </div>
      <div id="world-boss-table-container" class="world-boss-table-container"></div>
      <p id="world-boss-empty" class="empty-state" hidden>ไม่พบ World Boss ที่ตรงกับ Kind ที่กำหนด</p>
    </section>
  </section>
</main>
{% endblock %}
