upstream api_boss_backend {
    least_conn;

    server api_boss1:5000 max_fails=3 fail_timeout=30s;
    server api_boss2:5000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;

    location / {
        proxy_pass http://api_boss_backend;

        proxy_next_upstream error timeout http_429 http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}